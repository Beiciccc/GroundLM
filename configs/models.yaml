# The four model families + same-family scale control. All <=9B, bf16 fits in
# ~16-18 GB, so they run sequentially on one A100-40G; a 4xA100 node runs them
# in parallel (one model per GPU). No base-model training anywhere.

families:
  - id: meta-llama/Llama-3.1-8B-Instruct
    short: llama31_8b
  - id: Qwen/Qwen2.5-7B-Instruct
    short: qwen25_7b
  - id: mistralai/Mistral-7B-Instruct-v0.3
    short: mistral7b_v03
  - id: google/gemma-2-9b-it
    short: gemma2_9b

scale_control:
  - id: meta-llama/Llama-3.2-3B-Instruct
    short: llama32_3b      # same-family, different-scale control for C3 transfer

# Open NLI oracle for the Stage-6 conformal gate (FDR-E) and the NLI baseline.
# Single source of truth: matches src/groundlm/data/verify_support.py DEFAULT_NLI.
# All reported NLI numbers (cell-C entailment, RAGTruth NLI baseline) use this checkpoint.
nli_oracle: MoritzLaurer/DeBERTa-v3-base-mnli-fever-anli

# Retrievers for realistic noisy contexts in the gate eval (Stage 6).
retrievers:
  - intfloat/e5-base-v2
  - BAAI/bge-base-en-v1.5
