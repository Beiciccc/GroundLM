# Pilot configuration (single-node 4xA100-40G). Used by scripts/run_pilot.sh.
# The pilot answers the go/no-go: does the matched-pair cross-notion angle clear
# the within-notion null, and does the confidence asymmetry appear?

data:
  source: auto            # local NQ-Swap .jsonl path, or HF id ('auto' tries known mirrors)
  split: validation
  max_items: 1500         # 1500 items -> 6000 statements; pilot scale
  ctrlpairs: data/ctrlpairs.jsonl

extract:
  layers: mid             # 'all' | 'mid' (0.3-0.8 depth band) | comma list
  pooling: last           # last | mean  (ablate both for the paper)
  batch_size: 8
  max_len: 1024
  dtype: bfloat16
  device: cuda

analysis:
  method: mass_mean       # mass_mean | logistic
  knows_gold_only: false  # set true to condition C2/C3 on parametric belief

# Models for the pilot + full run (see configs/models.yaml)
pilot_model: meta-llama/Llama-3.1-8B-Instruct
